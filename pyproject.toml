[project]
name = "ai-common"
version = "0.1.0"
description = "Common classes and functions for AI code"
readme = "README.md"
authors = [
    { name = "Bertan Günyel", email = "bertan.gunyel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.3.3",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=4.2.1",
    "langchain-groq>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.1",
    "langchain-openrouter>=0.2.6",
    "ollama>=0.6.0",
    "openai>=2.6.0",
    # PEP 440 version normalisation, so the GuardDog wrapper can tell that a
    # lock's `13.0.3.0` and PyPI's `13.0.3` are one release. Already in the
    # graph transitively; declared because the wrapper imports it directly.
    "packaging>=25.0",
    "pillow>=11.3.0",
    "tavily-python>=0.7.12",
    "tqdm>=4.67.1",

]

[project.scripts]
guarddog-cached = "ai_common.security.guarddog_cached:cli"
guarddog-review = "ai_common.security.guarddog_review:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["pytest>=9.0.3"]
lint = ["ruff<1.0,>=0.5"]
scripts = [
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
]
